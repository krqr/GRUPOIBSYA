
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo IBSYA | Ingeniería Biomédica</title>

<style>
:root{
  --bg: #EDE9E1;
  --text: #2E2E2E;
  --blue: #187DB5;
  --blueDark: #075B91;
  --btnText: #FFFFFF;
}

*{
  box-sizing: border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family: -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display:flex;
  justify-content:center;
  padding: 50px 20px;
}

.container{
  width:100%;
  max-width:500px;
  text-align:center;
}

.logo{
  width:240px;
  max-width:85%;
  margin: 0 auto 30px;
  display:block;
}

h1{
  font-size:34px;
  margin:0;
  font-weight:800;
  letter-spacing:-0.5px;
  color:var(--blueDark);
}

.subtitle{
  font-size:24px;
  font-weight:400;
  color:var(--blue);
  margin:8px 0 35px;
  letter-spacing:1px;
}

.btn{
  display:block;
  width:100%;
  background:linear-gradient(
    135deg,
    var(--blue),
    var(--blueDark)
  );
  color:var(--btnText);
  text-decoration:none;
  padding:22px 18px;
  border-radius:14px;
  font-size:22px;
  font-weight:600;
  margin:18px 0;
  box-shadow:0 10px 20px rgba(0,80,140,0.18);
  transition:all .15s ease;
}

.btn:hover{
  opacity:.9;
  transform:scale(0.99);
}

@media (max-width:420px){
  h1{
    font-size:29px;
  }

  .subtitle{
    font-size:20px;
  }

  .btn{
    font-size:19px;
    padding:20px 15px;
  }

  .logo{
    width:210px;
  }
}
</style>
</head>

<body>
